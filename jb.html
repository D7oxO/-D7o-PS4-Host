<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>D7o // GoldHEN</title>
    <style>
      :root {
        --bg: #020202;
        --gold: #f4f7ff;
        --gold2: #ffffff;
        --gold-soft: rgba(255, 255, 255, .22);
        --text: #fff7cf;
        --muted: rgba(255, 236, 160, .58);
        --red: #ff3333;
        --ease: cubic-bezier(.23,1,.32,1);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 48%, rgba(255,255,255,.09), transparent 25%),
          radial-gradient(circle at 10% 15%, rgba(255,255,255,.055), transparent 30%),
          radial-gradient(circle at 90% 85%, rgba(255,255,255,.045), transparent 32%),
          var(--bg);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
        perspective: 1000px;
      }

      /* Gold flowing light ribbons */
      body::before,
      body::after {
        content: "";
        position: absolute;
        pointer-events: none;
        width: 120vw;
        height: 55vh;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 50%;
        transform: rotate(-23deg);
        filter: blur(.2px);
      }

      body::before {
        left: -40vw;
        top: -20vh;
        box-shadow:
          0 0 25px rgba(255,255,255,.12),
          0 0 90px rgba(255,255,255,.04);
      }

      body::after {
        right: -42vw;
        bottom: -22vh;
        transform: rotate(27deg);
        box-shadow:
          0 0 25px rgba(255,255,255,.12),
          0 0 90px rgba(255,255,255,.04);
      }

      #main-container {
        position: relative;
        z-index: 2;
        width: min(88vw, 470px);
        aspect-ratio: 1 / 1.12;
        padding: 42px 28px 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        background:
          linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.008)),
          rgba(0,0,0,.42);
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 34px;
        box-shadow:
          0 30px 100px rgba(0,0,0,.72),
          inset 0 0 55px rgba(255,255,255,.025),
          0 0 35px rgba(255,255,255,.035);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        transition: .6s var(--ease);
      }

      #main-container::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(255,255,255,.045);
        border-radius: 27px;
        pointer-events: none;
      }

      #brand {
        position: relative;
        z-index: 2;
        font-weight: 900;
        font-size: clamp(42px, 11vw, 68px);
        line-height: .9;
        letter-spacing: .02em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffffff 0%, #e9eef7 50%, #ffffff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 12px rgba(255,255,255,.20));
        margin-bottom: 7px;
      }

      #brand::after {
        content: "READY";
        display: block;
        margin-top: 11px;
        font-size: clamp(11px, 2.7vw, 16px);
        letter-spacing: .48em;
        text-align: center;
        padding-left: .48em;
        background: linear-gradient(90deg, #d9dee7, #ffffff, #d9dee7);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      #brand::before {
        content: "";
        position: absolute;
        left: 4%;
        right: -2%;
        bottom: -5px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
        box-shadow: 0 0 12px rgba(255,255,255,.45);
      }

      #status-label {
        margin-top: 31px;
        margin-bottom: 18px;
        padding: 10px 28px;
        min-width: 245px;
        text-align: center;
        font: 700 11px/1 'JetBrains Mono', monospace;
        letter-spacing: .27em;
        text-transform: uppercase;
        color: #ffffff;
        border: 1px solid rgba(255,255,255,.42);
        border-radius: 12px;
        background: rgba(255,190,0,.025);
        box-shadow:
          0 0 18px rgba(255,255,255,.07),
          inset 0 0 18px rgba(255,255,255,.025);
      }

      #visual-indicator {
        position: relative;
        width: min(42vw, 190px);
        height: min(42vw, 190px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #visual-indicator::before,
      #visual-indicator::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }

      #visual-indicator::before {
        inset: 4%;
        border: 2px solid rgba(255,255,255,.20);
        box-shadow: 0 0 28px rgba(255,255,255,.08);
      }

      #visual-indicator::after {
        inset: -7%;
        border: 1px dashed rgba(255,255,255,.18);
        animation: ring-spin 8s linear infinite;
      }

      .pulse {
        position: absolute;
        inset: 14%;
        border-radius: 50%;
        border: 3px solid #ffffff;
        animation: subtle-pulse 2s infinite;
        box-shadow:
          0 0 15px rgba(255,255,255,.35),
          inset 0 0 25px rgba(255,255,255,.08);
      }

      .core {
        width: 35%;
        height: 35%;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 30%, #ffffff, #e8edf5 45%, #aeb8c7 85%);
        box-shadow:
          0 0 18px #ffffff,
          0 0 50px rgba(255,255,255,.30);
        transition: .5s var(--ease);
      }

      #spin {
        position: absolute;
        inset: 1%;
        border: 2px solid transparent;
        border-top-color: #ffffff;
        border-right-color: rgba(255,255,255,.65);
        border-radius: 50%;
        animation: real-spin .8s linear infinite;
        opacity: .72;
        filter: drop-shadow(0 0 7px rgba(255,255,255,.55));
      }

      body.done #main-container {
        border-color: rgba(255,210,31,.62);
        box-shadow:
          0 30px 100px rgba(0,0,0,.72),
          0 0 70px rgba(255,210,31,.16),
          inset 0 0 50px rgba(255,210,31,.08);
      }

      body.done #brand {
        background: linear-gradient(135deg, #fffbd0 0%, #ffd21f 45%, #ff9d00 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(255,210,31,.55));
      }

      body.done #brand::after {
        content: "GOLDHEN";
        background: linear-gradient(90deg, #ffb300, #fff3a6, #ffb300);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      body.done #visual-indicator::before {
        border-color: rgba(255,210,31,.34);
        box-shadow: 0 0 32px rgba(255,190,0,.14);
      }

      body.done #visual-indicator::after {
        border-color: rgba(255,210,31,.32);
      }

      body.done #footer {
        color: rgba(255,220,100,.52);
      }

      body.done #status-label {
        color: #ffe98a;
        border-color: rgba(255,210,31,.62);
        box-shadow: 0 0 22px rgba(255,190,0,.14), inset 0 0 18px rgba(255,190,0,.05);
      }

      body.done #status-label::after {
        content: "  •  GOLDHEN ACTIVE";
      }

      body.done .pulse {
        border-color: #fff09a;
        animation: none;
        box-shadow: 0 0 30px #ffd21f, inset 0 0 25px rgba(255,210,31,.18);
      }

      body.done .core {
        background: radial-gradient(circle at 35% 30%, #fffbd0, #ffd21f 40%, #df9200 80%);
        box-shadow: 0 0 28px #ffd21f, 0 0 65px rgba(255,190,0,.7);
      }

      body.done #spin { opacity: 0; }

      body.fail #main-container {
        border-color: rgba(255,51,51,.5);
        box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 50px rgba(255,51,51,.12);
      }

      body.fail .pulse { border-color: var(--red); animation: none; }
      body.fail .core { background: var(--red); box-shadow: 0 0 28px var(--red); }
      body.fail #spin { opacity: 0; }

      #msg {
        position: fixed;
        left: 50%;
        bottom: 76px;
        transform: translateX(-50%);
        width: min(90vw, 500px);
        text-align: center;
        font: 12px/1.4 'JetBrains Mono', monospace;
        color: var(--red);
        letter-spacing: .12em;
        text-transform: uppercase;
        display: none;
        z-index: 4;
      }

      body.fail #msg { display: block; }

      #footer {
        position: fixed;
        z-index: 3;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font: 700 9px/1 'JetBrains Mono', monospace;
        color: rgba(255,255,255,.42);
        letter-spacing: .34em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      #wrap { padding: 0; }
      #state, #out { display: none; }

      body.log body::before,
      body.log body::after,
      body.log #main-container,
      body.log #footer,
      body.log #msg,
      body.log #status-label {
        display: none;
      }

      body.log {
        overflow: auto;
        display: block;
        padding: 20px;
        background: var(--bg);
      }

      body.log #wrap {
        display: block;
        max-width: 900px;
        margin: 0 auto;
      }

      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
      }

      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 'JetBrains Mono', monospace;
        background: rgba(255,255,255,.025);
        border: 1px solid rgba(255,210,31,.12);
        border-radius: 12px;
        padding: 16px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        color: var(--text);
      }

      .ok, .safe { color: var(--gold); }
      .bad, .danger { color: var(--red); }
      .warn { color: #e3b341; }
      code { color: #c8a33a; font-family: 'JetBrains Mono', monospace; }

      @keyframes real-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes ring-spin {
        to { transform: rotate(-360deg); }
      }

      @keyframes subtle-pulse {
        0%, 100% { transform: scale(.96); opacity: .55; }
        50% { transform: scale(1.04); opacity: 1; }
      }

      @media (max-height: 650px) {
        #main-container {
          width: min(82vw, 420px);
          padding-top: 25px;
        }
        #brand { font-size: 44px; }
        #status-label { margin-top: 18px; margin-bottom: 10px; }
        #visual-indicator { width: 145px; height: 145px; }
      }
    </style>
  </head>
  <body>

    <div id="main-container">
        <div id="brand">D7o</div>
        <div id="status-label">READY</div>
        <div id="visual-indicator">
            <div id="spin"></div>
            <div class="pulse"></div>
            <div class="core"></div>
        </div>
    </div>

    <div id="msg">Restart your console</div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div id="footer">D7o // GOLDHEN CORE</div>

    <script type="module">
      import "./jb.js?v=10";
    </script>

  </body>
</html>
